name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Generate the android/ folder (keeps our lib/main.dart and pubspec.yaml)
      - name: Create Android platform files
        run: flutter create --platforms android --org om.edu.asu --project-name secure_pass .

      - name: Set app name
        run: sed -i 's/android:label="secure_pass"/android:label="Secure Pass"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: SecurePass-APK
          path: build/app/outputs/flutter-apk/app-release.apk
